[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-subscription-agent"
version = "0.1.0"
description = "Read-only AutoBangumi connector for the anime subscription agent"
requires-python = ">=3.10"
dependencies = ["dify_plugin>=0.9.0,<1.0.0"]

[project.scripts]
ab-readonly = "anime_subscription_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
