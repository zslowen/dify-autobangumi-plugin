identity:
  name: subscribe_ab_rss
  author: zslowen
  label:
    en_US: Create verified AutoBangumi subscription
    zh_Hans: 创建并验证 AutoBangumi 订阅
description:
  human:
    en_US: High-risk controlled write. Consumes one confirmed preview ID, revalidates its stored snapshot, writes once, then verifies by read-back.
    zh_Hans: 高风险受控写入：消费一个已确认的预览 ID，重新校验其存储快照，只写入一次，并通过只读回查验证结果。
  llm: High-risk write tool. After the user explicitly confirms the current prepare_ab_subscription preview, copy only its preview_id into this tool. Never reconstruct or submit the RSS URL, title, season, year, selected group, or effective group. The preview is process-local, expires after 30 minutes, is invalid after plugin restart, and is consumed atomically on the first subscribe attempt. Unknown, expired, consumed, or restart-invalidated previews require a new preview and confirmation. The tool re-runs analysis and duplicate checks from the immutable stored snapshot, sends at most one subscription request, never retries a write, and verifies RSS and Bangumi state afterward.
parameters:
  - name: preview_id
    type: string
    required: true
    label:
      en_US: Confirmed preview ID
      zh_Hans: 已确认预览 ID
    human_description:
      en_US: Exact one-time preview_id returned by prepare_ab_subscription and explicitly confirmed by the user.
      zh_Hans: prepare_ab_subscription 返回且用户已经明确确认的一次性 preview_id。
    llm_description: Copy this value exactly from the currently confirmed preview. Do not submit or reconstruct any other subscription parameter.
    form: llm
extra:
  python:
    source: tools/subscribe_ab_rss.py
